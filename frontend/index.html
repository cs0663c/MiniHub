<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="page-title">我的导航页</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23667eea'/%3E%3Crect x='28' y='8' width='8' height='48' rx='3' fill='%23fff'/%3E%3Cpath d='M36 14 L52 22 L36 30 Z' fill='%23fff'/%3E%3Ccircle cx='32' cy='12' r='4' fill='%23ffcc00'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ===== 主面板 ===== -->
<div class="main-card">
  <div class="page-heading" id="page-heading">我的导航页</div>

  <div class="clock-area">
    <div id="time">00:00:00</div>
    <div id="date"></div>
  </div>

  <div class="search-area">
    <div class="search-box">
      <input id="search-input" type="text" placeholder="输入搜索内容..." onkeydown="if(event.key==='Enter')doSearch()">
      <button onclick="doSearch()">&#10140;</button>
    </div>
    <div class="search-engine">
      <span class="active" data-engine="baidu" onclick="setEngine(this)">百度</span>
      <span data-engine="google" onclick="setEngine(this)">Google</span>
      <span data-engine="bing" onclick="setEngine(this)">Bing</span>
    </div>
  </div>

  <div class="nav-section">
    <div class="nav-title">快捷导航</div>
    <div class="nav-grid" id="nav-grid"></div>
  </div>
</div>

<!-- ===== 全局页脚 ===== -->
<footer class="page-footer">
  <div class="footer-divider"></div>
  <div>&copy; <span id="footer-year"></span> <span id="footer-title">我的导航页</span></div>
  <div id="copyright-info"></div>
</footer>

<!-- ===== 网络模式切换 ===== -->
<label class="netmode-float" title="切换内外网访问地址">
  <input type="checkbox" id="netmode-cb" onchange="toggleNetworkMode()">
  <span class="netmode-switch"></span>
  <span class="netmode-text" id="netmode-text">外网</span>
</label>

<!-- ===== 管理按钮 ===== -->
<button class="admin-toggle" onclick="openAdminDialog()" title="管理">&#9881;</button>

<!-- ===== 管理弹窗 ===== -->
<div class="overlay" id="overlay" onclick="if(event.target===this)closeDialog()">
  <div class="dialog">
    <!-- 登录界面 -->
    <div id="login-form" style="padding:28px;">
      <h2 style="text-align:center;margin-bottom:24px;">&#128274; 账户登录</h2>
      <div class="login-form">
        <p id="login-msg">请输入账号密码</p>
        <input id="email-input" type="text" placeholder="邮箱" onkeydown="if(event.key==='Enter'){document.getElementById('pwd-input').focus()}">
        <input id="pwd-input" type="password" placeholder="密码" onkeydown="if(event.key==='Enter')doLogin()">
        <div class="btn-row">
          <button class="btn-secondary" onclick="showRegisterForm()">注册</button>
          <button class="btn-secondary" onclick="closeDialog()">取消</button>
          <button class="btn-primary" onclick="doLogin()">登录</button>
        </div>
        <div class="login-error" id="login-error">密码错误，请重试</div>
      </div>

      <!-- 注册表单 -->
      <div id="register-form" style="display:none;text-align:center;padding:20px 0 10px;">
        <p style="color:rgba(255,255,255,0.4);font-size:14px;margin-bottom:20px;">注册新账户</p>
        <input id="reg-email" type="text" placeholder="邮箱" style="display:block;margin:0 auto 10px;width:280px;padding:12px 16px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.15);border-radius:10px;color:#fff;font-size:16px;text-align:center;outline:none;">
        <input id="reg-pwd" type="password" placeholder="密码（至少4位）" style="display:block;margin:0 auto 10px;width:280px;padding:12px 16px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.15);border-radius:10px;color:#fff;font-size:16px;text-align:center;outline:none;">
        <div class="btn-row" style="display:flex;gap:12px;margin-top:20px;justify-content:center;">
          <button class="btn-secondary" onclick="hideRegisterForm()">返回登录</button>
          <button class="btn-primary" onclick="doRegister()">注册</button>
        </div>
        <div class="login-error" id="register-error" style="color:#f66;font-size:13px;margin-top:12px;display:none;"></div>
      </div>
    </div>

    <!-- 管理面板（登录后显示） -->
    <div id="admin-panel" style="display:none;flex-direction:column;flex:1;min-height:0;">
      <div class="dialog-header">
        <div class="tabs">
          <button class="tab-btn active" data-tab="nav" onclick="switchTab('nav')">导航管理</button>
          <button class="tab-btn" data-tab="settings" onclick="switchTab('settings')">页面设置</button>
        </div>
        <span class="user-badge" id="user-badge"></span>
        <button class="logout-btn" onclick="doLogout()" title="退出登录">退出</button>
        <button class="close-btn" onclick="closeDialog()">&times;</button>
      </div>
      <div class="dialog-body">
        <div id="tab-settings" style="display:none;">
          <div class="setting-group">
            <label>主页标题</label>
            <input id="setting-title" placeholder="我的导航页" maxlength="30">
          </div>
          <div class="setting-group">
            <label>页脚文字</label>
            <input id="setting-footer" placeholder="我的导航页" maxlength="40">
          </div>
          <div class="setting-group">
            <label>导航每行列数（3~10）</label>
            <input id="setting-columns" type="number" min="3" max="10" placeholder="6">
          </div>
          <div class="setting-group">
            <label>修改邮箱</label>
            <div class="pwd-change-form">
              <input id="email-pwd" type="password" placeholder="当前密码" maxlength="64" style="width:160px;">
              <input id="new-email" type="text" placeholder="新邮箱地址" maxlength="128" style="width:200px;">
              <button class="btn-primary btn-sm" onclick="doChangeEmail()">更新邮箱</button>
              <span class="pwd-change-msg" id="email-change-msg"></span>
            </div>
          </div>
          <div class="setting-group">
            <label>修改密码</label>
            <div class="pwd-change-form">
              <input id="old-pwd" type="password" placeholder="当前密码" maxlength="64">
              <input id="new-pwd" type="password" placeholder="新密码（至少4位）" maxlength="64">
              <input id="new-pwd2" type="password" placeholder="确认新密码" maxlength="64">
              <button class="btn-primary btn-sm" onclick="doChangePassword()">更新密码</button>
              <span class="pwd-change-msg" id="pwd-change-msg"></span>
            </div>
          </div>
          <div class="setting-group" id="create-user-group">
            <label>创建子账户</label>
            <div class="pwd-change-form">
              <input id="new-user-email" type="text" placeholder="子账户邮箱" maxlength="128" style="width:200px;">
              <input id="new-user-pwd" type="password" placeholder="子账户密码" maxlength="64" style="width:160px;">
              <button class="btn-primary btn-sm" onclick="doCreateUser()">创建</button>
              <span class="pwd-change-msg" id="create-user-msg"></span>
            </div>
          </div>
          <p class="tip" style="text-align:left;">修改后点击底部"保存全部"生效</p>
        </div>
        <div id="tab-nav">
          <div id="edit-list"></div>
        </div>
      </div>
      <div class="dialog-footer">
        <button class="add-btn" onclick="addNavItem()">+ 新建导航</button>
        <button class="save-all-btn" onclick="saveAll()">保存全部</button>
      </div>
    </div>
  </div>
</div>

<!-- ===== 图标选择器弹窗 ===== -->
<div class="icon-picker-overlay" id="icon-picker-overlay">
  <div class="icon-picker">
    <div class="icon-picker-header">
      <input id="icon-search" type="text" placeholder="搜索图标..." oninput="filterIcons()">
      <select class="style-select" id="icon-style" onchange="switchIconStyle()">
        <option value="border-radius">圆角矩形</option>
        <option value="circle">圆形</option>
      </select>
      <button onclick="closeIconPicker()">&times;</button>
    </div>
    <div class="icon-picker-body">
      <div class="icon-picker-grid" id="icon-picker-grid">
        <div class="icon-picker-loading">加载图标列表中...</div>
      </div>
    </div>
  </div>
</div>

<script src="js/api.js"></script>
<script src="js/app.js"></script>
</body>
</html>
